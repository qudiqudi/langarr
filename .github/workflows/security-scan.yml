name: Security Scan

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  # Weekly scan for new advisories. GitHub runs schedules only on the default branch.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  gitleaks:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history for better detection
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Fail a PR that adds a dependency with a known high or critical vulnerability
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  dependency-check:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: './language-tagger'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Report but don't fail - vulnerabilities show in Security tab

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-fs

  # Audit the workflows for unpinned actions, template injection and wide permissions
  workflow-audit:
    name: Workflow Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: '1.30.1'
          advanced-security: false

  file-patterns:
    name: Check for Sensitive Files
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for sensitive files
        run: |
          echo "Checking for sensitive files and patterns..."

          # Files that should never be committed
          FORBIDDEN_FILES=(
            ".env"
            "*.pem"
            "*.key"
            "*.p12"
            "*.pfx"
            "id_rsa"
            "id_dsa"
            "*.crt"
            "credentials.json"
            "auth.json"
            "secrets.yml"
            "secrets.yaml"
          )

          FOUND_ISSUES=0

          for pattern in "${FORBIDDEN_FILES[@]}"; do
            if find . -name "$pattern" -not -path "./.git/*" | grep -q .; then
              echo "❌ FOUND SENSITIVE FILE: $pattern"
              find . -name "$pattern" -not -path "./.git/*"
              FOUND_ISSUES=1
            fi
          done

          # Check for common patterns in code (exclude constants, examples, and documentation)
          echo ""
          echo "Checking for hardcoded secrets patterns..."

          if grep -r -i --include="*.py" --include="*.yml" --include="*.yaml" --include="*.js" --include="*.ts" \
            -E "(password|passwd|pwd|secret|token|api_key|apikey)\s*=\s*['\"][^'\"]{8,}" \
            --exclude-dir=".git" --exclude-dir="node_modules" . \
            | grep -v ".example" \
            | grep -v "your-secure-random-token-here" \
            | grep -v "# Special token for testing" \
            | grep -v "# not a real secret" \
            | grep -v "constants.py" \
            | grep -v -E ":[A-Z_]*TOKEN\s*=" ; then
            echo "❌ FOUND POTENTIAL HARDCODED SECRETS"
            FOUND_ISSUES=1
          fi

          # Check for API keys/tokens patterns
          if grep -r -E "(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36}|AIza[0-9A-Za-z_-]{35})" \
            --exclude-dir=".git" --exclude-dir="node_modules" . ; then
            echo "❌ FOUND API KEY PATTERNS"
            FOUND_ISSUES=1
          fi

          if [ $FOUND_ISSUES -eq 1 ]; then
            echo ""
            echo "⚠️  Security check FAILED! Sensitive information detected."
            echo "Please remove sensitive files and hardcoded secrets before committing."
            exit 1
          else
            echo ""
            echo "✅ No sensitive files or patterns detected."
          fi

  docker-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Docker image for scanning
        run: |
          docker build -t langarr-scan:latest ./language-tagger

      - name: Run Trivy on Docker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'langarr-scan:latest'
          format: 'sarif'
          output: 'trivy-docker-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail, just report

      - name: Upload Docker scan results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('trivy-docker-results.sarif') != ''
        with:
          sarif_file: 'trivy-docker-results.sarif'
          category: trivy-image
