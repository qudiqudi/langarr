name: CI

on:
  pull_request:
    branches: [ main, develop ]
  # docker-build.yml calls this workflow before it pushes an image
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The job names lint, type-check and build-test are required status checks
# on main and develop. Do not rename them without a change to the branch protection.
jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./webui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: webui/.nvmrc
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
        env:
          HUSKY: 0
      - run: npm run lint

  type-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./webui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: webui/.nvmrc
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
        env:
          HUSKY: 0
      - run: npm run type-check

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./webui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: webui/.nvmrc
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
        env:
          HUSKY: 0
      - run: npm test

  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./webui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: webui/.nvmrc
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
        env:
          HUSKY: 0
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      # Same server build as in the Dockerfile
      - run: npx tsc -p tsconfig.server.json

  # Build the image for the PR, but do not push it. docker-build.yml pushes on main, develop and tags.
  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./webui
          platforms: linux/amd64
          push: false
          cache-from: type=gha
