name: CI

on:
  pull_request:
    branches: [ main, develop ]
  # docker-build.yml calls this workflow before it pushes an image
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The job names lint, type-check and build-test are required status checks
# on main and develop. Do not rename them without a change to the branch protection.
jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./language-tagger
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: language-tagger/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check --output-format=github .

  # The v1 code does not pass mypy yet. This job compiles all files and
  # imports all modules with the pinned dependencies from requirements.txt.
  type-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./language-tagger
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: language-tagger/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile all files
        run: python -m compileall -q .
      - name: Import all modules
        run: |
          python - <<'EOF'
          import importlib
          import importlib.util

          for name in ["api_client", "constants", "overseerr_integration", "webhook_server"]:
              importlib.import_module(name)

          spec = importlib.util.spec_from_file_location("arr_language_tagger", "arr-language-tagger.py")
          spec.loader.exec_module(importlib.util.module_from_spec(spec))
          EOF

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./language-tagger
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            language-tagger/requirements.txt
            language-tagger/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests

  # Build the image, but do not push it. docker-build.yml pushes on main, develop and tags.
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./language-tagger
          platforms: linux/amd64
          push: false
          cache-from: type=gha
