# Dependabot reads this file only from the default branch (main).
# Keep the same file on main and develop.
#
# main holds v1 (language-tagger, Python). develop holds v2 (webui, Node).
# The entries with target-branch: develop update v2 until it is merged into main.
version: 2
updates:
  # v1 on main
  - package-ecosystem: "pip"
    directory: "/language-tagger"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "docker"
    directory: "/language-tagger"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "area/docker"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "area/ci"
    commit-message:
      prefix: "chore(deps)"

  # v2 on develop
  - package-ecosystem: "npm"
    directory: "/webui"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # These majors need a manual migration (Next 16, ESLint flat config, Tailwind 4, React 19)
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # Keep the types on the Node version of webui/.nvmrc and the Dockerfile
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
    commit-message:
      # include: "scope" adds (deps) or (deps-dev) after the prefix
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/webui"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    ignore:
      # A Node major is a manual change, together with webui/.nvmrc and @types/node
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "area/docker"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "area/ci"
    commit-message:
      prefix: "chore(deps)"
